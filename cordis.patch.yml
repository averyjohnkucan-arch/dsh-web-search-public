# Cordis replaces an entry's whole config object when applying this patch.
# Select BOTH providers: selecting search alone drops the inherited fetch choice
# and causes WEB_PROVIDER_AMBIGUOUS when multiple fetch backends are registered.
- id: web
  config:
    searchProvider: public
    fetchProvider: http

- id: web-fetch-http
  disabled: false

# Disable only DeepSeek's web backends, not its chat models or account service.
- id: web-search-deepseek
  disabled: true

- id: web-deepseek-api
  disabled: true

- insert:
    - id: web-search-public
      name: '@averyjohnkucan-arch/dsh-web-search-public'
